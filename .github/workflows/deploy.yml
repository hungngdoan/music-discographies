name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate data against schemas
        run: npm run validate

      # `base` in astro.config.mjs puts the build under /music-discographies/.
      - name: Build
        run: npm run build

      - name: Verify the build output
        run: |
          out=dist
          test -f "$out/index.html" || { echo "::error::index.html missing"; exit 1; }
          test -f "$out/404.html" || { echo "::error::404.html missing"; exit 1; }
          grep -q '/music-discographies/' "$out/index.html" \
            || { echo "::error::assets are not prefixed with the /music-discographies/ base"; exit 1; }
          echo "index.html, 404.html and the base prefix are all present."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
