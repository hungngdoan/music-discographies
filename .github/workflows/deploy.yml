name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Validate data against schemas
        run: npm run validate

      # The SQLite exporter is not used by the site, so nothing else would
      # notice it rotting. It exists to de-risk a future move off JSON, which
      # is worth exactly nothing if it has quietly stopped working.
      - name: Exercise the SQLite exporter
        run: npm run db:export

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      # This builds the site itself, through playwright.config.mjs webServer,
      # and runs every assertion against that build. `base` in astro.config.mjs
      # puts the output under /music-discographies/. Do not add a separate
      # build step: a second build is not guaranteed to be the one the tests
      # graded, and the artefact uploaded below must be the tested one.
      - name: Build and run browser tests
        run: npm test

      - name: Verify the build output
        run: |
          out=dist
          test -f "$out/index.html" || { echo "::error::index.html missing"; exit 1; }
          test -f "$out/404.html" || { echo "::error::404.html missing"; exit 1; }
          grep -q '/music-discographies/' "$out/index.html" \
            || { echo "::error::assets are not prefixed with the /music-discographies/ base"; exit 1; }
          echo "index.html, 404.html and the base prefix are all present."

      - name: Upload the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
