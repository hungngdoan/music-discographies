<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Music Discographies</title>
    <!--
      The build rewrites this with --base-href. Every asset request in the app
      is relative and resolves against it, so it must match the deploy path:
      "/" for ng serve, "/music-discographies/" for GitHub Pages.
    -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A hand-curated reference of song titles, the albums they appear on, and release years."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
